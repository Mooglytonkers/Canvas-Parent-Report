name: Windows installer

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to its GitHub Release
        required: true
        default: v2.2.0
        type: string

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Read the app version
        id: version
        shell: pwsh
        run: |
          $iss = Get-Content -Raw "installer\CanvasParentReport.iss"
          if ($iss -notmatch '#define MyAppVersion "([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "MyAppVersion was not found in the Inno Setup script."
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=CanvasParentReport-Setup-$version" >> $env:GITHUB_OUTPUT

      - name: Build the app folder
        run: pyinstaller --noconfirm --clean CanvasParentReport.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          Write-Host "Using $iscc"
          & $iscc "installer\CanvasParentReport.iss"

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "installer\Output\CanvasParentReport-Setup-$version.exe"
          if (-not (Test-Path $exe)) { throw "Installer was not built: $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          $name = Split-Path $exe -Leaf
          Set-Content -Path "installer\Output\SHA256SUMS.txt" -Value "$hash  $name" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            installer/Output/CanvasParentReport-Setup-${{ steps.version.outputs.version }}.exe
            installer/Output/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.installer.outputs.artifact }}
          path: installer/Output

      - name: Attach installer to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Canvas Parent Report ${{ needs.installer.outputs.version }}
          body: |
            Download the CanvasParentReport-Setup exe attached to this release, then double-click it.

            SHA256SUMS.txt is the SHA-256 checksum for that installer. The installed app checks the download against this file before it runs an update. Your settings, Canvas token, and scheduled report stay in place.

            Windows may say it protected your PC. Choose More info, then Run anyway.
          files: |
            installer/Output/CanvasParentReport-Setup-${{ needs.installer.outputs.version }}.exe
            installer/Output/SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: false
