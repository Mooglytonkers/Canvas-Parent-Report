name: Windows installer

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to its GitHub Release
        required: true
        default: v2.0.0
        type: string

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build the app folder
        run: pyinstaller --noconfirm --clean CanvasParentReport.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          Write-Host "Using $iscc"
          & $iscc "installer\CanvasParentReport.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanvasParentReport-Setup-2.1.0
          path: installer/Output/CanvasParentReport-Setup-2.1.0.exe
          if-no-files-found: error

  release:
    needs: installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: CanvasParentReport-Setup-2.1.0
          path: installer/Output

      - name: Attach installer to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Canvas Parent Report 2.1.0
          body: |
            Download CanvasParentReport-Setup-2.1.0.exe below, then double-click it.

            What's new:
            - Optional To Do detail pages. They stay off until you turn them on.
            - Choose how often the report runs: twice a day, once a day, or once a week.

            Windows may say it protected your PC. Choose More info, then Run anyway.
          files: installer/Output/CanvasParentReport-Setup-2.1.0.exe
          overwrite_files: true
          fail_on_unmatched_files: false
