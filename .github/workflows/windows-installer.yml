name: Windows installer

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build the app folder
        run: pyinstaller --noconfirm --clean CanvasParentReport.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          Write-Host "Using $iscc"
          & $iscc "installer\CanvasParentReport.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanvasParentReport-Setup-2.0.0
          path: installer/Output/CanvasParentReport-Setup-2.0.0.exe
          if-no-files-found: error

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/CanvasParentReport-Setup-2.0.0.exe
