# Copy this file to config.ini and edit it.
#   Windows: copy config.example.ini config.ini
#   macOS/Linux: cp config.example.ini config.ini
#
# Or run the setup wizard, which writes config.ini for you:
#   python3 setup_wizard.py
#
# The access token does NOT belong in this file. Put it in a .env file
# (see .env.example) or in the CANVAS_TOKEN environment variable.

[canvas]
# Your school's Canvas website, with no trailing slash.
# Example: https://yourschool.instructure.com
base_url = https://yourschool.instructure.com

# Time zone used for due dates and the "generated at" stamp on the PDF.
# Use an IANA name such as America/New_York, America/Chicago, or America/Los_Angeles.
timezone = America/New_York

# Optional. Only needed if you created the token on a parent/observer account
# and that account is linked to more than one student. Leave blank to
# auto-detect (one observed student, or the token owner's own account).
# Find IDs by running: python3 fetch_canvas.py --list-observees
student_user_id =

[report]
# Shown in the PDF header. Leave student_name blank to use the name Canvas has on file.
student_name = Alex Sample
school_name = Example High School

# Only include assignments due on or after this date (YYYY-MM-DD).
start_date = 2026-11-01

# If true, any graded item is treated as submitted and is left off the
# missing list. A LATE flag can still appear for graded work that was
# turned in after the due date.
graded_counts_as_submitted = true

# Folder for JSON and PDF output (created automatically).
output_dir = output

[todo]
# If true, after each report the script marks graded items done on the
# student's Canvas To Do list. This only changes checkmarks; it does not
# submit work or change grades.
#
# Default is false. Turn this on only after you have looked at a report
# and are comfortable with the change. It requires a token created on
# the student's own account. It is automatically skipped for observer
# (parent) tokens, because those checkmarks would not apply to the student.
mark_graded_todos_done = false

# Optional. If left blank, start_date is used. Set an earlier date if you
# also want older graded items marked done (YYYY-MM-DD).
todo_since_date =

[email]
# EMAIL_ENABLED. Off by default. Set to true to email the PDF after each report.
enabled = false

# EMAIL_TO. Comma-separated addresses, for example parent@example.com, other@example.com
to =

# EMAIL_FROM. The address in the From line. Often the same mailbox you log in with.
from =

# SMTP_HOST. Examples: smtp.gmail.com or smtp.office365.com
smtp_host =

# SMTP_PORT. Default 587 (STARTTLS). Use 465 for SSL.
smtp_port = 587

# SMTP_USE_TLS. true means STARTTLS (the usual setting for port 587).
# Use ssl for implicit SSL, or set the port to 465 (that port always uses SSL).
# false sends without encryption, which most mail servers reject.
smtp_use_tls = true

# SMTP_USERNAME and SMTP_PASSWORD are not set in this file.
# Put them in .env only (see .env.example). The password is never read from
# config.ini. The setup wizard asks for it with a hidden prompt and writes
# it only to .env.

[print]
# PRINT_ENABLED. Off by default. Set to true to print the PDF after each report.
# You can also pass --print or --no-print on the command line.
enabled = false

# PRINTER_NAME. Leave blank to use the system default printer.
# On macOS or Linux, `lpstat -p` lists names. On Windows, use the name shown
# in Settings > Printers, and install SumatraPDF for reliable silent printing.
printer_name =

# PRINT_COPIES. Default 1, maximum 20. Jobs are sent one at a time.
copies = 1

# Optional custom command. Leave blank to use the built-in printer support
# (SumatraPDF / Adobe / Windows default print, or lp on macOS and Linux).
# If this is set, it is used instead of the built-in support. Use {pdf}
# as the file path.
#
#   lp -d PrinterName {pdf}
print_command =

[messages]
# A teacher Canvas message is included when it is tied to a missing or late
# assignment, or when it is a course-wide notice that looks like it is about
# grades or missing work. Edit this comma-separated keyword list if you want
# different matching.
notice_keywords = grade, grades, grading, graded, missing, late, failing, failed, failure, deadline, deadlines, d or an f, d or f, emails home, emailing families
